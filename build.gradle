plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

// Security patch levels released after the Spring Boot 3.5.16 BOM.
ext['jackson-bom.version'] = '2.21.5'
ext['httpclient5.version'] = '5.6.3'
ext['httpcore5.version'] = '5.4.3'
ext['log4j2.version'] = '2.26.1'
ext['netty.version'] = '4.1.138.Final'
ext['opentelemetry.version'] = '1.62.0'
ext['postgresql.version'] = '42.7.13'
ext['tomcat.version'] = '10.1.59'

def sensitivePackagingExcludes = [
        'application-local.yml',
        'key/**'
]

group = 'univ'
version = '0.0.1-SNAPSHOT'
description = 'AirConnect'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Data
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation('com.google.firebase:firebase-admin:9.10.0') {
        // AirConnect uses Firebase Messaging only. Keeping the optional XML mapper
        // off the MVC classpath prevents */* API responses from negotiating to XML.
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
    }

    // Email
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // WebSocket (채팅)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Configuration Processor
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // IAP (Google Play API access token)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.52.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    //admod
    implementation "com.google.crypto.tink:apps-rewardedads:1.14.0"
    implementation "com.google.crypto.tink:tink:1.23.0"

    //openai
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

}

tasks.named('test') {
    useJUnitPlatform()
    // Keep date-boundary tests deterministic regardless of the developer/CI host timezone.
    systemProperty 'user.timezone', 'UTC'
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('bootJar') {
    excludes.addAll(sensitivePackagingExcludes)
}

tasks.named('jar') {
    excludes.addAll(sensitivePackagingExcludes)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
